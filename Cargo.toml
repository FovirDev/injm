[package]
name = "injm"
description = "A CLI tool that injects content into marked regions in source files."
version = "0.8.0"
edition = "2024"
license = "MIT"
keywords = ["cli", "inject", "code", "marker"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/FovirDev/injm"
homepage = "https://github.com/FovirDev/injm"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3.3"
ignore = "0.4.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
tabled = "0.21.0"
thiserror = "2.0.18"
toml = "1.1.3"
tree-sitter-language-pack = "1.12.0"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
tempfile = "3.27.0"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "injm_bench"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
